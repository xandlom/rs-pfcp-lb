# Docker Compose test infrastructure for PFCP Proxy/Load Balancer
# This setup includes:
# - PFCP Proxy/LB (listening on port 8805)
# - 3 UPF simulators (based on rs-pfcp examples)
# - Test SMF client
#
# Usage:
#   docker compose up -d
#   docker compose run --rm smf-client
#   docker compose logs -f pfcp-proxy

services:
  # PFCP Proxy/Load Balancer
  pfcp-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pfcp-proxy
    command:
      - "--listen"
      - "0.0.0.0:8805"
      - "--backends"
      - "upf1:8805,upf2:8805,upf3:8805"
      - "--strategy"
      - "round-robin"
      - "--stats-interval"
      - "10"
      - "--health-check-interval"
      - "5"
      - "--log-level"
      - "info"
    ports:
      - "8805:8805/udp"  # PFCP port
      - "9090:9090"      # Metrics port (future)
    networks:
      pfcp-net:
        ipv4_address: 172.20.0.10
    depends_on:
      - upf1
      - upf2
      - upf3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "pfcp-proxy"]
      interval: 10s
      timeout: 3s
      retries: 3

  # UPF Backend 1
  upf1:
    build:
      context: ./docker/rs-pfcp-examples
      dockerfile: Dockerfile
    container_name: upf1
    command: ["session-server", "--interface", "eth0", "--port", "8805"]
    networks:
      pfcp-net:
        ipv4_address: 172.20.0.11
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "session-server"]
      interval: 10s
      timeout: 3s
      retries: 3

  # UPF Backend 2
  upf2:
    build:
      context: ./docker/rs-pfcp-examples
      dockerfile: Dockerfile
    container_name: upf2
    command: ["session-server", "--interface", "eth0", "--port", "8805"]
    networks:
      pfcp-net:
        ipv4_address: 172.20.0.12
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "session-server"]
      interval: 10s
      timeout: 3s
      retries: 3

  # UPF Backend 3
  upf3:
    build:
      context: ./docker/rs-pfcp-examples
      dockerfile: Dockerfile
    container_name: upf3
    command: ["session-server", "--interface", "eth0", "--port", "8805"]
    networks:
      pfcp-net:
        ipv4_address: 172.20.0.13
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "session-server"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Test SMF Client (manual start)
  smf-client:
    build:
      context: ./docker/rs-pfcp-examples
      dockerfile: Dockerfile
    container_name: smf-client
    command: ["session-client", "--interface", "eth0", "--address", "pfcp-proxy", "--port", "8805", "--sessions", "10"]
    networks:
      pfcp-net:
        ipv4_address: 172.20.0.20
    depends_on:
      - pfcp-proxy
    profiles:
      - testing  # Only start when explicitly requested
    restart: "no"

networks:
  pfcp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  pfcp-logs:
    driver: local
