# PFCP Proxy/Load Balancer Configuration Example
#
# This is a comprehensive configuration example showing all available options.
# Copy this file to /etc/pfcp-proxy/config.toml or specify with --config flag.

[proxy]
# Address to listen on for PFCP messages
listen_address = "0.0.0.0:8805"

# Number of worker threads (default: number of CPU cores)
# threads = 8

# UDP buffer size for receiving messages
buffer_size = 65536

[load_balancing]
# Load balancing strategy
# Options: "round-robin", "least-sessions", "weighted"
strategy = "least-sessions"

# Session timeout in seconds (for cleanup of idle sessions)
session_timeout = 3600

# Health check interval in seconds
health_check_interval = 5

# Heartbeat timeout in seconds
heartbeat_timeout = 2

# Backend UPF configurations
[[backends]]
address = "10.0.1.10:8805"
weight = 1.0
zone = "us-west-1a"
max_sessions = 10000

[[backends]]
address = "10.0.1.11:8805"
weight = 1.0
zone = "us-west-1b"
max_sessions = 10000

[[backends]]
address = "10.0.1.12:8805"
weight = 0.5
zone = "us-west-1c"
max_sessions = 5000

[health]
# Number of consecutive failures before marking UPF as unhealthy
failure_threshold = 3

# Number of consecutive successes before marking UPF as healthy again
recovery_threshold = 5

# Response time threshold for degraded status (milliseconds)
degraded_latency_ms = 100

# Response time threshold for unhealthy status (milliseconds)
unhealthy_latency_ms = 500

[metrics]
# Enable metrics collection
enabled = true

# Prometheus metrics export port
prometheus_port = 9090

# Metrics export interval in seconds
export_interval = 10

# Metrics retention in days
retention_days = 7

[logging]
# Log level: "trace", "debug", "info", "warn", "error"
level = "info"

# Log format: "json" or "text"
format = "json"

# Log output file path (stdout if empty)
output = "/var/log/pfcp-proxy/proxy.log"
